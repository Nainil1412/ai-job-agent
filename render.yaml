services:
  - type: web
    name: ai-job-agent-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w @ai-job-agent/shared && npm run build -w @ai-job-agent/matching && npm run build -w @ai-job-agent/job-connectors && npm run build -w @ai-job-agent/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/ai-job-agent-data
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
  - type: web
    name: ai-job-agent-web
    runtime: static
    buildCommand: npm install && npm run build -w @ai-job-agent/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-job-agent-api
          property: host
